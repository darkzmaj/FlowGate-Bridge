plugins { id 'java' }
group = 'si.terona'
version = '1.0.1'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.194-stable'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.194-stable'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
configurations.configureEach {
    if (canBeResolved) attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
test { useJUnitPlatform() }
def pluginVersion = project.version.toString()
processResources {
    inputs.property 'version', pluginVersion
    filesMatching('plugin.yml') { expand(version: pluginVersion) }
}
jar {
    archiveBaseName = 'FlowGate-Bridge'
    from('LICENSE')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
