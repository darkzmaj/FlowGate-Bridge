name: FlowGate-Bridge
version: '${version}'
main: dev.korinetwork.FlowGateBridge
api-version: '1.21'
folia-supported: true
author: DarkZmaj
description: A minimal Paper plugin to bridge slash-commands to proxy servers.
website: https://kori.my

commands:
  flowgate-bridge:
    description: Main command for FlowGate-Bridge
    permission: flowgatebridge.admin
    usage: /<command> reload

permissions:
  flowgatebridge.admin:
    description: Allows reloading the FlowGate-Bridge config
    default: op

  flowgatebridge.use:
    description: Allows configured connection commands (proxy policy still applies)
    default: true
